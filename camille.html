 <div class="match-detail"><h3>Cuándo atacar</h3><p>${safe(p.matchup.window)}</p></div>
 <div class="match-detail"><h3>Qué evitar</h3><p>${safe(p.matchup.warning)}</p></div>
 <div class="match-detail"><h3>Plan contra los otros cuatro</h3><p>${safe(p.statusNote)} ${safe(p.phases[2].text)}</p></div>
 <div class="callout" style="margin-top:13px"><strong>Recordatorio de Camille</strong><p>Q1 para preparar Q2; no entres con E sin salida ni información del jungla. Prepara oleada antes de disputar objetivos.</p></div>
 <button class="primary wide" id="backDraft" type="button">${ic('bolt')} VER BUILD COMPLETA</button>`;
}
function historyPage(){
 const percent=Math.max(0,Math.min(100,Math.round((state.latest / Math.max(1,state.cutoff))*1000)/10));
 return `<div class="eyebrow">TU CAMINO COMPETITIVO</div><div class="sec-head"><h2>Maestro + TOP 200 Camille</h2></div>
 <div class="leaderboard"><div class="progress-head"><strong>${state.latest.toLocaleString('es-CL')}</strong><span>vs ${state.cutoff.toLocaleString('es-CL')} pts corte</span></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><p class="note">${percent}% del corte registrado. Para superar ese valor fijo, faltarían ${Math.max(0,state.cutoff-state.latest+1).toLocaleString('es-CL')} puntos. El corte del ranking cambia.</p>
 <div class="progress-inputs"><div class="field"><label for="pointsInput">TUS PUNTOS</label><input id="pointsInput" type="number" min="0" max="100000" inputmode="numeric" value="${state.latest}"></div><div class="field"><label for="cutoffInput">CORTE TOP 200</label><input id="cutoffInput" type="number" min="1" max="100000" inputmode="numeric" value="${state.cutoff}"></div></div><button class="quickbutton" style="margin-top:10px;width:100%" id="savePoints" type="button">ACTUALIZAR PROGRESO</button></div>
 <div class="sec-head"><h2>Composiciones guardadas</h2><span class="sec-note">${state.history.length} registros locales</span></div>
 <div class="history-list">${state.history.length ? state.history.map((h,i)=>`<button class="history-entry" type="button" data-open-history="${i}"><span><strong>${safe(h.draft.top)} / ${safe(h.draft.jg)} / ${safe(h.draft.mid)}</strong><span>${safe(h.draft.adc)} · ${safe(h.draft.sup)} · ${safe(h.date)}</span></span><span style="color:var(--mint);font-size:19px">›</span></button>`).join(''):'<div class="empty">Todavía no guardas composiciones.<br>Genera una guía y pulsa GUARDAR DRAFT.</div>'}</div>
 ${state.history.length?'<button id="clearHistory" type="button" class="quickbutton muted" style="margin-top:14px">BORRAR HISTORIAL LOCAL</button>':''}
 <div class="callout" style="margin-top:20px"><strong>Datos exclusivamente locales</strong><p>No se envían tus selecciones ni historial a un servidor. La información se guarda en este navegador mientras no borres sus datos.</p></div>`;
}
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false')});
 $('#content').innerHTML=state.tab==='draft'?buildDraft():state.tab==='matchup'?matchupPage():historyPage();
 bindView();
 if(state.tab==='draft'&&state.plan){try{state.plan=analyzeDraft(state.draft,state.settings);$('#analysisOutput').innerHTML=planMarkup(state.plan);bindPlanButtons();}catch{state.plan=null;}}
}
function bindView(){
 document.querySelectorAll('.champ-slot').forEach(btn=>btn.addEventListener('click',()=>openPicker(btn.dataset.role)));
 $('#exampleBtn')?.addEventListener('click',()=>{state.draft={...DEFAULT_DRAFT};state.settings.danger='';state.plan=null;store();render();toast('Ejemplo Gwen cargado')});
 $('#resetBtn')?.addEventListener('click',()=>{state.draft={top:'',jg:'',mid:'',adc:'',sup:''};state.plan=null;state.settings.danger='';store();render();toast('Selecciona cinco campeones')});
 $('#focusSel')?.addEventListener('change',e=>{state.settings.focus=e.target.value;store();if(state.plan){state.plan=analyzeDraft(state.draft,state.settings);$('#analysisOutput').innerHTML=planMarkup(state.plan);bindPlanButtons()}});
 $('#stateSel')?.addEventListener('change',e=>{state.settings.state=e.target.value;state.settings.danger='';if($('#dangerSel'))$('#dangerSel').value='';store();if(state.plan){state.plan=analyzeDraft(state.draft,state.settings);$('#analysisOutput').innerHTML=planMarkup(state.plan);bindPlanButtons()}});
 $('#dangerSel')?.addEventListener('change',e=>{state.settings.danger=e.target.value;state.settings.state='even';if($('#stateSel'))$('#stateSel').value='even';store();if(state.plan){state.plan=analyzeDraft(state.draft,state.settings);$('#analysisOutput').innerHTML=planMarkup(state.plan);bindPlanButtons()}});
 $('#analyzeBtn')?.addEventListener('click',()=>{try{state.plan=analyzeDraft(state.draft,state.settings);$('#analysisOutput').innerHTML=planMarkup(state.plan);bindPlanButtons();$('#analysisOutput').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){toast(e.message)}});
 $('#backDraft')?.addEventListener('click',()=>{state.tab='draft';state.plan=analyzeDraft(state.draft,state.settings);render();window.scrollTo({top:0,behavior:'smooth'})});
 $('#savePoints')?.addEventListener('click',()=>{const x=Number($('#pointsInput').value),y=Number($('#cutoffInput').value);if(!Number.isInteger(x)||x<0||!Number.isInteger(y)||y<1||x>100000||y>100000){toast('Comprueba los puntos');return}state.latest=x;state.cutoff=y;store();render();toast('Puntuación actualizada')});
 $('#clearHistory')?.addEventListener('click',()=>{if(window.confirm('¿Borrar los drafts guardados en este dispositivo?')){state.history=[];store();render();toast('Historial borrado')}});
 document.querySelectorAll('[data-open-history]').forEach(b=>b.addEventListener('click',()=>{let h=state.history[Number(b.dataset.openHistory)];if(!h)return;state.draft={...h.draft};state.settings={...h.settings};state.tab='draft';state.plan=analyzeDraft(state.draft,state.settings);store();render();toast('Draft recuperado')}));
}
function bindPlanButtons(){
 $('#copyBuild')?.addEventListener('click',async()=>{const p=state.plan;const b=[p.boots.name,...p.items.map(x=>x.name)];const s=`CAMILLE FAST ${PATCH}\n${p.team.map(c=>`${c.role.toUpperCase()}: ${c.name}`).join(' · ')}\n${b.join(' → ')}\nRunas: ${Object.values(p.runes).filter(x=>typeof x==='string').join(' / ')}\nBuild adaptada por reglas (no copia TOP CN).`;try{await navigator.clipboard.writeText(s);toast('Build copiada')}catch{const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('Build copiada')}});

 $('#copyPlan')?.addEventListener('click',async()=>{const t=planToText(state.draft,state.plan);try{await navigator.clipboard.writeText(t);toast('Guía copiada')}catch{const box=document.createElement('textarea');box.value=t;document.body.append(box);box.select();document.execCommand('copy');box.remove();toast('Guía copiada')}});
 $('#savePlan')?.addEventListener('click',()=>{state.history.unshift({draft:{...state.draft},settings:{...state.settings},date:new Date().toLocaleString('es-CL')});state.history=state.history.slice(0,25);store();toast('Composición guardada')});
 $('#downloadPlan')?.addEventListener('click',()=>{const t=planToText(state.draft,state.plan);const url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`CamilleFAST_${state.draft.top.replace(/\s/g,'_')}_${PATCH}.txt`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('TXT preparado')});
 $('#detailsBtn')?.addEventListener('click',()=>{state.tab='matchup';render();window.scrollTo({top:0,behavior:'smooth'})});
}
function openPicker(role){
 state.selectedRole=role;const r=ROLES.find(x=>x.id===role);$('#modalRole').textContent=`ENEMIGO · ${r.label}`;$('#championSearch').value='';renderPicker();$('#championModal').showModal();setTimeout(()=>$('#championSearch').focus(),80);
}
function renderPicker(){
 const input=$('#championSearch').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const list=champions.filter(c=>c.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(input));
 $('#championCount').textContent=`${list.length} campeones`;
 $('#championList').innerHTML=list.length?list.map(c=>{
  const selected=state.draft[state.selectedRole]===c.name;
  const isUsed=Object.entries(state.draft).some(([k,n])=>k!==state.selectedRole&&n===c.name);
  return `<button type="button" class="champ-choice ${selected?'selected':''}" data-champ="${safe(c.name)}" ${isUsed?'disabled title="Ya elegido en otra posición"':''}>${avatar(c.name,c.damage)}<span class="choice-text">${safe(c.name)}<span class="choice-sub" style="display:block">${c.tags.includes('tank')?'Tanque · ':c.tags.includes('mage')?'Mago · ':c.tags.includes('assassin')?'Asesino · ':c.tags.includes('bruiser')?'Luchador · ':'Campeón · '}${c.cc>=2?'Control alto':'Amenaza situacional'}</span></span><span class="dmg ${safe(c.damage)}">${c.damage}</span></button>`
 }).join(''):'<div class="empty">No hay coincidencias en este catálogo.</div>';
 document.querySelectorAll('[data-champ]').forEach(b=>b.addEventListener('click',()=>{
  state.draft[state.selectedRole]=b.dataset.champ;state.settings.danger='';state.plan=null;store();$('#championModal').close();render();
 }));
}
let toastTimeout;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2500)}
function wireBase(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})}));
 $('#championSearch').addEventListener('input',renderPicker);
 $('#closeModal').addEventListener('click',()=>$('#championModal').close());
 $('#championModal').addEventListener('click',e=>{if(e.target===$('#championModal'))$('#championModal').close()});
 const updateOnline=()=>{const status=$('#offlineState');status.classList.toggle('off',!navigator.onLine);status.title=navigator.onLine?'Conectado':'Sin conexión'};
 window.addEventListener('online',updateOnline);window.addEventListener('offline',updateOnline);updateOnline();
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.installPrompt=e;$('#installBtn').title='Instalar Camille FAST'});
 $('#installBtn').addEventListener('click',async()=>{
  if(state.installPrompt){state.installPrompt.prompt();try{const r=await state.installPrompt.userChoice;if(r.outcome==='accepted')toast('Instalación solicitada')}catch{}state.installPrompt=null;}
  else toast('En Chrome: menú ⋮ → Añadir a pantalla de inicio / Instalar aplicación');
 });
 /* standalone HTML: worker intentionally omitted */
}
wireBase();render();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', async () => {
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshed) {
        refreshed = true;
        // Draft selections live in localStorage, so refresh is safe after activation.
        window.location.reload();
      }
    });
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      // Browsers can defer scheduled SW checks; explicitly check on app opening.
      await registration.update();
    } catch (err) {
      console.warn('Service worker update unavailable', err);
    }
  });
}
</script>
</body>
</html>
