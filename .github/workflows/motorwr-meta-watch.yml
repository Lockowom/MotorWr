# MetaSync v2.2: initial live adapter verification after failing closed on source markup
name: MotorWr — automatic meta synchronization

on:
  push:
    branches: [main]
    paths: ['.github/workflows/motorwr-meta-watch.yml']
  schedule:
    - cron: '17 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: motorwr-meta-sync-preview
  cancel-in-progress: false

jobs:
  sync:
    name: Validate Riot patch and editorial guide updates
    if: github.repository == 'Lockowom/MotorWr'
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - name: Checkout beta branch (production remains isolated)
        uses: actions/checkout@v4
        with:
          ref: feature/multi-champion-v2
          persist-credentials: true
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review source changes conservatively
        run: node scripts/sync-meta.mjs
      - name: Validate metadata and PWA
        run: npm test
      - name: Build non-production preview
        run: npm run build
      - name: Commit audited metadata only to beta branch
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!src/data/autoMeta.json' || { echo 'Unexpected modified path'; exit 1; }
          if git diff --quiet -- src/data/autoMeta.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new patch, rune or guide changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/autoMeta.json
            git commit -m 'data(meta): synchronized verified Wild Rift sources'
            git push origin HEAD:feature/multi-champion-v2
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish updated Cloudflare preview only
        if: steps.meta.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4e5250a7fe2c9281b03e6a2d184897e8
          command: pages deploy dist --project-name=buldwr --branch=multi-champion-v2
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo 'Automated meta audit runs at 08:17 and 20:17 UTC.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Writes and uploads ONLY the isolated beta; main PWA is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Updated source data: ${{ steps.meta.outputs.changed }}' >> "$GITHUB_STEP_SUMMARY"
